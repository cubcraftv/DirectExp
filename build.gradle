plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def junitVersion = '6.1.3'
def isWindows = System.getProperty("os.name", "").toLowerCase(Locale.ROOT).contains("windows")
// Keep CMake/Ninja's dependency and object cache outside build/ so
// `gradlew clean` does not force Shaderc and SPIRV-Tools to rebuild.
def nativeBuildDir = layout.projectDirectory.dir(".gradle/native")
def nativeBridgeOutput = layout.buildDirectory.file("native/directexp_native.dll")
def nativeBridgeSources = fileTree("${project.projectDir}/native/src") {
	include("*.cpp")
}
def nativeBridgeHeaders = fileTree("${project.projectDir}/native/src") {
	include("*.h")
}
// CMake's FindJNI caches its include paths, so changing JAVA_HOME alone does
// not replace JNI headers previously discovered from another JDK. Pass the
// active Gradle JDK's include paths explicitly as well.
def currentJavaHome = new File(System.getProperty("java.home")).canonicalPath.replace('\\', '/')
def currentJavaInclude = "${currentJavaHome}/include"
def currentJavaPlatformInclude = "${currentJavaInclude}/win32"

base {
	archivesName = project.mod_id
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"
}

// By default Loom's splitEnvironmentSourceSets() only wires the `test`
// source set up against `main`, not `client`. Milestone 4.2's shader
// source/preprocessing stage lives in `client` (it needs Blaze3D types
// like ShaderSource/RenderPipeline, which are client-only), but the whole
// point of that milestone is that it stays unit-testable in pure Java/JVM
// terms -- see docs/plans/2026-09-25-directexp-milestone4-breakdown.md.
// Extending `test`'s classpath with `client`'s output and compile/runtime
// classpath (the same shape `mods { "${project.mod_id}" { ... } }` above
// already combines both source sets under) makes that possible without
// moving client-only code into `main`.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "mod_id", project.mod_id
	inputs.property "mod_name", project.mod_name

	filesMatching("fabric.mod.json") {
		expand(
			"version": inputs.properties.version,
			"mod_id": inputs.properties.mod_id,
			"mod_name": inputs.properties.mod_name
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Native bridge build.
//
// Unlike MetalExp (which shells out to `xcrun clang` directly), the DirectX
// 11 bridge is built through CMake so the task works whether the developer
// has plain MSVC (Developer Command Prompt / vswhere-discoverable Build
// Tools) or clang-cl on PATH. This task requires:
//   - CMake >= 3.25 on PATH
//   - A working MSVC (or clang-cl) toolchain on PATH, i.e. run Gradle from
//     a "Developer Command Prompt for VS" or an environment where vcvars
//     has already been sourced.
// See native/README.md for the exact local setup steps.
tasks.register("configureNativeWindowsBridge", Exec) {
	onlyIf { isWindows }
	inputs.files(nativeBridgeSources)
	inputs.files(nativeBridgeHeaders)
	inputs.file("${project.projectDir}/native/CMakeLists.txt")
	inputs.property("javaHome", currentJavaHome)
	outputs.dir(nativeBuildDir)
	workingDir project.projectDir

	doFirst {
		nativeBuildDir.asFile.mkdirs()
	}

	commandLine([
		"cmake",
		"-S", "native",
		"-B", nativeBuildDir.asFile.absolutePath,
		"-DCMAKE_BUILD_TYPE=Release",
		"-DJAVA_HOME=${currentJavaHome}",
		"-DJAVA_INCLUDE_PATH=${currentJavaInclude}",
		"-DJAVA_INCLUDE_PATH2=${currentJavaPlatformInclude}",
		"-DJAVA_AWT_INCLUDE_PATH=${currentJavaInclude}",
		// Explicit generator instead of relying on CMake's Windows default
		// (which falls back to "NMake Makefiles" and assumes an MSVC
		// Developer Command Prompt environment). Ninja works identically
		// whether the discovered compiler is MSVC's cl.exe (from a
		// Developer Command Prompt) or MinGW-w64's gcc/g++ (e.g. MSYS2
		// UCRT64) -- either way, requires `ninja` on PATH. See
		// native/README.md for both setups.
		"-G", "Ninja"
	])
	environment "JAVA_HOME", currentJavaHome
	environment "JDK_HOME", currentJavaHome
}

tasks.register("buildNativeWindowsBridge", Exec) {
	onlyIf { isWindows }
	dependsOn(tasks.named("configureNativeWindowsBridge"))
	inputs.files(nativeBridgeSources)
	inputs.files(nativeBridgeHeaders)
	inputs.property("javaHome", currentJavaHome)
	outputs.file(nativeBridgeOutput)
	workingDir project.projectDir
	environment "JAVA_HOME", currentJavaHome
	environment "JDK_HOME", currentJavaHome

	commandLine([
		"cmake",
		"--build", nativeBuildDir.asFile.absolutePath,
		"--config", "Release"
	])

	doLast {
		// Ninja (our explicit generator, see configureNativeWindowsBridge)
		// is single-config, so the DLL lands directly under the build dir.
		// Still check the MSVC-multi-config-style Release/ subfolder too,
		// in case someone overrides the generator locally to something
		// like "Visual Studio 17 2022".
		def flatDll = nativeBridgeOutput.get().asFile
		def candidates = [
			nativeBuildDir.file("directexp_native.dll").asFile,
			nativeBuildDir.dir("Release").file("directexp_native.dll").asFile
		]
		def builtDll = candidates.find { it.exists() }

		if (builtDll != null && builtDll != flatDll) {
			flatDll.parentFile.mkdirs()
			java.nio.file.Files.copy(
				builtDll.toPath(),
				flatDll.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
			)
			return
		}
		if (!flatDll.exists()) {
			logger.warn("directexp_native.dll was not found after the native build; check native/README.md.")
		}
	}
}

test {
	useJUnitPlatform()
	// Deliberately not wired to the native build: unit tests must run on
	// any OS (including CI on Linux/macOS) without a DirectX toolchain.
	// Native integration tests live under a separate, Windows-only task
	// once the bridge has real entrypoints to probe.
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	if (isWindows) {
		dependsOn(tasks.named("buildNativeWindowsBridge"))
		from(nativeBridgeOutput) {
			into("META-INF/native/windows-x86_64")
		}
	}

	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

tasks.named("build") {
	dependsOn(tasks.named("buildNativeWindowsBridge"))
}

tasks.named("runClient") {
	if (isWindows) {
		dependsOn(tasks.named("buildNativeWindowsBridge"))
		systemProperty("directexp.nativeLibraryPath", nativeBridgeOutput.get().asFile.absolutePath)
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
